[package]
name = "wow-viewer"
description = "Windowed asset viewer for WoW 3.3.5a client data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
# Attaches the icon to the executable. A Windows resource table is not
# something a Rust compiler writes, so this shells out to the SDK's rc.exe --
# and `build.rs` treats a missing one as a warning. Passes the reuse test: it
# is the operating system's own packaging, nothing to do with WoW.
embed-resource = "3"

[dependencies]
mpq = { path = "../../crates/mpq" }
blp = { path = "../../crates/blp" }
render = { path = "../../crates/render" }

wgpu.workspace = true
bytemuck.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
png.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
m2 = { version = "0.0.1", path = "../../crates/m2" }
collision = { version = "0.0.1", path = "../../crates/collision" }
dbc = { version = "0.0.1", path = "../../crates/dbc" }
glam.workspace = true
wmo = { version = "0.0.1", path = "../../crates/wmo" }
adt = { version = "0.0.1", path = "../../crates/adt" }
# The viewer can stand in a live world, not only in one read off disk.
auth = { version = "0.0.1", path = "../../crates/auth" }
world = { version = "0.0.1", path = "../../crates/world" }
ui = { version = "0.0.1", path = "../../crates/ui" }
rfd.workspace = true
rodio = { version = "0.21.1", default-features = false, features = ["mp3", "playback", "symphonia-mp3", "symphonia-wav", "wav"] }
