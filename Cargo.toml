[workspace]
resolver = "2"
members = ["crates/*", "tools/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/m0nnnna/MeoWoW"

[workspace.dependencies]
# Generic plumbing only. Every WoW-specific format is implemented in-tree
# from public documentation -- see docs/REUSE-POLICY.md.
thiserror = "2"
anyhow = "1"
flate2 = "1"
bzip2-rs = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
png = "0.17"
# Graphics stack. egui-wgpu pins a wgpu major, so these three move together --
# see docs/BUILDING.md before bumping any of them independently.
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
# The interface layout is a file the user is expected to open and edit, which
# is why it is TOML and not a binary blob -- see docs/UI.md.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# The operating system's own folder picker, for the one setting a person has to
# supply before this client can do anything: where their WoW install is. The
# field beside it stays editable, so this is a convenience rather than a
# dependency the feature rests on. Passes the reuse test easily -- asking an OS
# for a directory has nothing to do with WoW.
#
# `default-features = false` deliberately: rfd's defaults are the *Linux*
# backend (`xdg-portal`, and an async runtime to drive it), and on Windows the
# native dialogue needs neither. A Linux build of the viewer has to turn
# `xdg-portal` back on -- said here rather than discovered, because the feature
# it disables is not one this platform can notice missing.
rfd = { version = "0.15", default-features = false }

[profile.dev]
# Format parsing on multi-GB archives is unusable in a fully unoptimized build,
# but we still want fast incremental compiles of our own code.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
