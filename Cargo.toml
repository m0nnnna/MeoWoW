[workspace]
resolver = "2"
members = ["crates/*", "tools/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/floofywolf/open-wow-client"

[workspace.dependencies]
# Generic plumbing only. Every WoW-specific format is implemented in-tree
# from public documentation -- see docs/REUSE-POLICY.md.
thiserror = "2"
anyhow = "1"
flate2 = "1"
bzip2-rs = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
png = "0.17"
# Graphics stack. egui-wgpu pins a wgpu major, so these three move together --
# see docs/BUILDING.md before bumping any of them independently.
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
# The interface layout is a file the user is expected to open and edit, which
# is why it is TOML and not a binary blob -- see docs/UI.md.
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.dev]
# Format parsing on multi-GB archives is unusable in a fully unoptimized build,
# but we still want fast incremental compiles of our own code.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
